name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            os: ubuntu-22.04
            suite: core
          - python-version: "3.12"
            os: ubuntu-latest
            suite: full

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg
        if: matrix.suite == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run Python 3.8 core tests
        if: matrix.suite == 'core'
        run: python -m unittest -v tests.test_video_splitter.VideoSplitterTests

      - name: Run full test suite
        if: matrix.suite == 'full'
        run: python -m unittest discover -s tests -v
